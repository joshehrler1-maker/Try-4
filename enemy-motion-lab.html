<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enemy Motion Lab | Super Paw Heroes</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08132c;color:#f4f6ff;font:16px/1.5 system-ui,sans-serif}main{max-width:950px;margin:auto;padding:20px}a{color:#8feaff}h1{margin-bottom:4px}.note{color:#cbd9f7}label{display:block;margin:15px 0}select,button{font:inherit;padding:10px;border:1px solid #9ab5eb;border-radius:9px;background:#20365c;color:white}canvas{display:block;width:100%;height:auto;border:2px solid #688fd0;border-radius:18px;background:#14233f}#info{min-height:5em}.controls{display:flex;gap:10px;flex-wrap:wrap}button:focus-visible,select:focus-visible{outline:3px solid #ffe27e}footer{margin-top:25px;color:#b9c8e6}
</style></head><body><main><a href="pawcade-side-scroll.html">← Back to games</a><h1>Enemy Motion Lab</h1>
<p class="note">Original animated vector concept prototypes for 25 games. These are <strong>not</strong> final 3D models or integrated enemies.</p>
<label for="game">Choose a game</label><select id="game"></select>
<canvas id="scene" width="800" height="400" role="img" aria-label="Animated enemy concept on a platform"></canvas>
<div class="controls"><button id="idle">Idle</button><button id="move">Move</button><button id="attack">Attack</button><button id="hit">Hit</button><button id="defeat">Defeat</button><button id="pause" aria-pressed="false">Pause animation</button><label for="speed">Playback speed <output id="speed-value">1.0×</output></label><input id="speed" type="range" min="0.25" max="1.5" step="0.05" value="1"></div>
<p id="info" aria-live="polite"></p><footer>Motion prototype: anticipation → attack → recovery; reduced-motion preference supported. No paid services.</footer></main>
<script>
(async()=>{
const select=document.querySelector('#game'),info=document.querySelector('#info'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
let registry;
try{const response=await fetch('assets/enemy-art-motion-registry.json');if(!response.ok)throw Error('Registry unavailable');registry=await response.json()}catch(e){info.textContent='Could not load enemy designs: '+e.message;return}
for(const item of registry.games){const option=document.createElement('option');option.value=item.gameIndex;option.textContent=(item.gameIndex+1)+'. '+item.game+' — '+item.enemyFamily;select.append(option)}
const palettes=[['#ff9a4d','#743529'],['#c6a6ff','#413466'],['#67f5e0','#246e8d'],['#eac978','#5b4d3b'],['#a6e868','#34694a'],['#a5edff','#396d9c'],['#ffcd69','#85446b'],['#f5a9ff','#543d9c'],['#ff85a6','#61346a'],['#d3d8e6','#596477'],['#a3f5ec','#39748d'],['#e7f4ff','#647caa'],['#ffde73','#386b98'],['#e8b36e','#685b32'],['#b3b4ff','#383f86'],['#b0ef83','#487d4b'],['#ff9e69','#805b4c'],['#d8f4ff','#6799bc'],['#e8bd84','#8c6945'],['#8ae6eb','#37618a'],['#ff79e3','#4942a5'],['#e8e2d6','#8b7792'],['#b6ed88','#506b58'],['#f8df70','#9e7435'],['#9ad8ff','#485f95']];
let mode='idle',started=performance.now(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,paused=false,pausedAt=0,speed=1;
const pauseButton=document.querySelector('#pause'),speedInput=document.querySelector('#speed');
pauseButton.onclick=()=>{paused=!paused;if(paused){pausedAt=performance.now()}else{started+=performance.now()-pausedAt}pauseButton.textContent=paused?'Resume animation':'Pause animation';pauseButton.setAttribute('aria-pressed',String(paused))};
speedInput.oninput=()=>{const now=paused?pausedAt:performance.now();const elapsed=(now-started)*speed;speed=Number(speedInput.value);started=now-elapsed/speed;document.querySelector('#speed-value').textContent=speed.toFixed(2)+'×'};
function describe(){const e=registry.games[Number(select.value)];info.textContent=e.enemyFamily+' — '+e.silhouette+'. Attack: '+e.signatureAttack+'. Effect: '+e.vfx+'. Current motion: '+mode+'.'}
select.onchange=()=>{started=performance.now();describe()};for(const state of ['idle','move','attack','hit','defeat'])document.querySelector('#'+state).onclick=()=>{mode=state;started=performance.now();describe()};describe();
function frame(now){
const index=Number(select.value),t=reduced?0:((paused?pausedAt:now)-started)/1000*speed,colors=palettes[index],p=mode==='attack'?Math.min(t/1.3,1):0;
const anticipation=p<.27?p/.27:0,impact=p>=.27&&p<.65?Math.sin((p-.27)/.38*Math.PI):0;
const walk=mode==='move'&&!reduced?Math.sin(t*9):0,bob=mode==='idle'&&!reduced?Math.sin(t*2)*2:0;
ctx.clearRect(0,0,800,400);
const sky=ctx.createLinearGradient(0,0,0,400);sky.addColorStop(0,colors[1]);sky.addColorStop(1,'#09172c');ctx.fillStyle=sky;ctx.fillRect(0,0,800,400);
for(let j=0;j<12;j++){ctx.fillStyle='#ffffff13';ctx.beginPath();ctx.arc((j*89+index*13)%800,50+(j*43)%220,2+(j%4),0,7);ctx.fill()}
ctx.fillStyle='#31465e';ctx.fillRect(0,324,800,76);ctx.fillStyle=colors[0];ctx.fillRect(0,324,800,6);
const x=400+(mode==='move'?Math.sin(t*1.4)*115:0)+(mode==='attack'?impact*65:0);
ctx.save();ctx.translate(x,302+bob+(mode==='move'?Math.abs(walk)*-3:0)+(mode==='hit'?Math.sin(Math.min(t,1)*25)*7:0));ctx.scale(mode==='defeat'?Math.max(.1,1-Math.min(t,1)) :1,1);
ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,23,75,12,0,0,7);ctx.fill();
ctx.lineCap='round';ctx.strokeStyle=colors[1];ctx.lineWidth=15;
for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(side*24,-20);ctx.lineTo(side*(25+walk*12),13-Math.max(0,walk*side)*9);ctx.stroke();ctx.fillStyle=colors[0];ctx.beginPath();ctx.ellipse(side*(25+walk*12),15-Math.max(0,walk*side)*9,19,8,0,0,7);ctx.fill()}
ctx.rotate(mode==='attack'?-anticipation*.22:0);
ctx.shadowColor=colors[0];ctx.shadowBlur=20;
ctx.fillStyle=colors[1];ctx.beginPath();ctx.ellipse(0,-62,53,62,0,0,7);ctx.fill();ctx.shadowBlur=0;
ctx.strokeStyle=colors[0];ctx.lineWidth=5;ctx.stroke();
// Each game receives a different silhouette language, not merely a recolor.
const motifs=['tongs','pages','fins','pendulum','seed','mist','lantern','magnets','drum','stone','kite','cloud','coils','leaves','orbit','bamboo','pistons','ice','sand','sonar','pixels','mosaic','moss','petals','cargo'];
const motif=motifs[index];ctx.fillStyle=colors[0];ctx.strokeStyle=colors[0];ctx.lineWidth=6;
function poly(points){ctx.beginPath();points.forEach(([px,py],i)=>i?ctx.lineTo(px,py):ctx.moveTo(px,py));ctx.closePath();ctx.fill()}
function circle(px,py,r){ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill()}
function rect(px,py,w,h){ctx.fillRect(px,py,w,h)}
switch(motif){
case 'tongs':for(const d of [-1,1])poly([[d*28,-104],[d*65,-151],[d*76,-143],[d*49,-97]]);break;
case 'pages':for(const d of [-1,1]){ctx.save();ctx.rotate(d*.2);rect(d*8-35,-151,58,34);ctx.restore()}break;
case 'fins':for(const d of [-1,1])poly([[d*20,-92],[d*92,-125],[d*65,-60]]);break;
case 'pendulum':rect(-7,-156,14,55);circle(0,-156,24);break;
case 'seed':for(let k=0;k<5;k++){const a=k*6.283/5;poly([[0,-105],[Math.cos(a)*55,Math.sin(a)*36-118],[Math.cos(a+.6)*30,Math.sin(a+.6)*25-112]])}break;
case 'mist':for(let k=0;k<4;k++)circle(-45+k*30,-125-(k%2)*13,25);break;
case 'lantern':rect(-31,-164,62,48);rect(-18,-177,36,12);break;
case 'magnets':for(const d of [-1,1]){rect(d*42-9,-143,18,65);circle(d*42,-143,15)}break;
case 'drum':rect(-62,-128,124,29);for(let k=-2;k<=2;k++)rect(k*22-4,-141,8,54);break;
case 'stone':for(const d of [-1,1])poly([[d*24,-110],[d*66,-155],[d*91,-121],[d*54,-95]]);break;
case 'kite':poly([[0,-179],[72,-120],[0,-99],[-72,-120]]);break;
case 'cloud':for(let k=0;k<5;k++)circle((k-2)*25,-120-(k%2)*18,27);break;
case 'coils':for(const d of [-1,1]){ctx.beginPath();for(let k=0;k<6;k++)ctx.lineTo(d*(30+k*9),-100-k*11);ctx.stroke()}break;
case 'leaves':for(const d of [-1,1])poly([[d*15,-110],[d*100,-167],[d*69,-102]]);break;
case 'orbit':for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(0,-90,70+k*9,18+k*12,k*.65,0,7);ctx.stroke()}break;
case 'bamboo':for(const d of [-1,1]){rect(d*57-9,-170,18,96);for(let k=0;k<3;k++)rect(d*57-14,-155+k*30,28,5)}break;
case 'pistons':for(const d of [-1,1]){rect(d*50-19,-139,38,55);rect(d*50-8,-162,16,24)}break;
case 'ice':for(let k=-2;k<=2;k++)poly([[k*24,-104],[k*24+12,-155-Math.abs(k)*7],[k*24+22,-104]]);break;
case 'sand':for(const d of [-1,1])poly([[d*20,-100],[d*72,-146],[d*94,-97]]);break;
case 'sonar':for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(0,-110,35+k*18,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}break;
case 'pixels':for(let k=0;k<9;k++)rect((k%3-1)*38,-164+Math.floor(k/3)*25,22,20);break;
case 'mosaic':for(let k=0;k<5;k++)poly([[k*24-60,-118],[k*24-48,-144],[k*24-35,-118]]);break;
case 'moss':for(let k=0;k<7;k++)circle((k-3)*19,-122-(k%3)*12,13);break;
case 'petals':for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.beginPath();ctx.ellipse(Math.cos(a)*49,Math.sin(a)*30-109,25,12,a,0,7);ctx.fill()}break;
case 'cargo':rect(-59,-149,118,43);for(let k=-1;k<=1;k++)rect(k*35-12,-160,24,12);break;
}
ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-17,-72,9,12,0,0,7);ctx.ellipse(17,-72,9,12,0,0,7);ctx.fill();ctx.fillStyle='#15203b';ctx.beginPath();ctx.arc(-15,-72,4,0,7);ctx.arc(19,-72,4,0,7);ctx.fill();
ctx.strokeStyle=colors[0];ctx.lineWidth=12;
for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(side*43,-65);ctx.lineTo(side*(70+impact*38),-43-impact*32);ctx.stroke();ctx.fillStyle=colors[0];ctx.beginPath();ctx.arc(side*(70+impact*38),-43-impact*32,13,0,7);ctx.fill()}
if(impact>0){ctx.strokeStyle='#fff7';ctx.lineWidth=4;ctx.beginPath();ctx.arc(100,-48,impact*75,0,Math.PI*2);ctx.stroke()}
ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText(registry.games[index].enemyFamily,20,32);
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script></body></html>
