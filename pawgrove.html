'use strict';
const $=id=>document.getElementById(id), canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const keys=new Set(), p={x:0,z:0,face:0,hp:5}, joy={x:0,z:0,id:null};
const gems=[{x:-6,z:13},{x:7,z:24},{x:-7,z:36}], npcs=[{x:3,z:5,name:'Poppy'},{x:-4,z:30,name:'Milo'}];
const lantern={x:0,z:60}, gateZ=43;
const loot=[
 {x:1,z:7,name:'Pawblade',hint:'Close-range attack unlocked.'},
 {x:-2,z:19,name:'Crescent Shield',hint:'Hold Guard to block a hit.'},
 {x:2,z:29,name:'Comet Launcher',hint:'Launch star seeds at distant enemies or the gate switch.'},
 {x:4,z:39,name:'Ember Key',hint:'Opens Ember Hollow after you hit its switch.'}
];
const gateSwitch={x:3,z:44.5};
let gear,gate,guarding,seeds,windup;
function has(i){return gear.has(i)}

function reset(){
 Object.assign(p,{x:0,z:0,face:0,hp:5}); for(const g of gems)g.taken=false;

 gear=new Set();gate=false;seeds=0;windup=0;guard(false);won=spoken=false;hit=shot=flash=noteTime=0;note='';
}
reset();
const count=()=>gems.filter(g=>g.taken).length, dist=o=>Math.hypot(o.x-p.x,o.z-p.z);
function say(line){note=line;noteTime=5}
function talk(){
 const npc=npcs.find(n=>dist(n)<4);
 if(npc){spoken=true;say(npc.name==='Poppy'?'Poppy: Brassfang stole our lantern light. Bring three sparks to the shrine!':'Milo: Queen Ember guards the shrine. Take the Comet Launcher, find the Ember Key, and shoot the glowing switch.')}
 else say('Move closer to Poppy or Milo to talk.');
}
function attack(ranged){
 if(won||!p.hp||(ranged?shot:hit)>0)return;
 if(!has(ranged?2:0)){say(ranged?'Find the Comet Launcher on Sunpaw Trail.':'Pick up the Pawblade by the village path.');return}
 if(ranged){
  if(!seeds){say('Out of star seeds. Walk back to the launcher chest for more.');return}
  seeds--;shot=.55;
  if(!gate&&has(3)&&dist(gateSwitch)<9){gate=true;say('The gate opens. Enter Ember Hollow!');return}
 }else hit=.32;
 const target=foes.filter(f=>f.hp&&dist(f)<(ranged?9:2.6)).sort((a,b)=>dist(a)-dist(b))[0];
 if(target){target.hp=Math.max(0,target.hp-(ranged?1:2));target.flash=.2;if(!target.hp&&has(2))seeds=Math.min(16,seeds+3)}
}

$('reset').onclick=reset;$('talk').onclick=talk;$('attack').onclick=()=>attack(false);$('pulse').onclick=()=>attack(true);

shield.onpointerup=shield.onpointercancel=shield.onlostpointercapture=()=>guard(false);
shield.onkeydown=e=>{if(has(1)&&[' ','Enter'].includes(e.key))guard(true)};
shield.onkeyup=shield.onblur=()=>guard(false);

stick.onpointerdown=e=>{if(joy.id!==null)return;joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);drag(e)};
stick.onpointermove=e=>{if(e.pointerId===joy.id)drag(e)};
function release(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.z=0;$('knob').style.transform=''}
stick.onpointerup=stick.onpointercancel=stick.onlostpointercapture=release;

addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();guard(false)});
function update(dt){
 for(const f of foes)f.flash=Math.max(0,(f.flash||0)-dt);
 hit=Math.max(0,hit-dt);shot=Math.max(0,shot-dt);flash=Math.max(0,flash-dt);noteTime=Math.max(0,noteTime-dt);
 if(won||!p.hp)return;
 let x=joy.x+Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));
 let z=joy.z+Number(keys.has('w')||keys.has('arrowup'))-Number(keys.has('s')||keys.has('arrowdown'));
 const blocking=has(1)&&(guarding||keys.has('shift'));
 const speed=(blocking?2.8:5)*dt/Math.max(1,Math.hypot(x,z));
 p.x=Math.max(-12,Math.min(12,p.x+x*speed));p.z=Math.max(-2,Math.min(gate?61:gateZ-.7,p.z+z*speed));
 if(Math.hypot(x,z)>.1)p.face=Math.atan2(x,z);
 for(const g of gems)if(!g.taken&&dist(g)<1.4){g.taken=true;say('Lantern spark found!')}
 loot.forEach((item,i)=>{
  if(dist(item)>=1.6||has(i))return;
  gear.add(i);if(i===2)seeds=12;say(item.name+' found. '+item.hint)
 });
 if(has(2)&&dist(loot[2])<1.6&&seeds<6)seeds=12;
 for(const f of foes){
  const d=dist(f);
  if(!f.hp||d>7)continue;
  if(d>1.25){f.x+=(p.x-f.x)*dt*1.7/d;f.z+=(p.z-f.z)*dt*1.7/d}
  if(f.boss){
   if(d>=2.6){windup=0;continue}
   windup+=dt;
   if(windup>=.85){windup=0;if(!flash&&!blocking){p.hp--;flash=1.5}else if(blocking)say('Crescent Shield blocked Queen Ember!')}
  }else if(d<1.7&&!flash){if(!blocking)p.hp--;flash=1.5}
 }
 if(dist(lantern)<2.3&&count()===3&&!foes.at(-1).hp)won=true;
}
function project(x,y,z){

 const s=350/depth;

}
