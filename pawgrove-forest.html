  if(Number.isFinite(y)){Object.assign(p,{x:nx,y,z:nz});break}
 }
}
const palettes=[['#779059','#617448','#6d8250'],['#88775e','#786953','#6e684d'],['#628952','#4e6f46','#5c7d4d']];
const surfaces=faces.map(f=>{
 const [a,b,c]=f.map(i=>vertices[i]);
 const u=b.map((x,i)=>x-a[i]),v=c.map((x,i)=>x-a[i]);
 const ny=Math.abs(u[0]*v[2]-u[2]*v[0]);
 const length=Math.hypot(ny,u[1]*v[2]-u[2]*v[1],u[0]*v[1]-u[1]*v[0]);
 const style=ny>length*.72?(a[1]>220?2:0):1;
 return {f,color:palettes[style][Math.abs(Math.floor((a[0]+a[2])/260))%3]};
});
function poly(points,color){
 ctx.fillStyle=color;ctx.beginPath();
 points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
 ctx.closePath();ctx.fill();
}
function clipNear(points){
 const output=[];
 for(let i=0;i<points.length;i++){
  const a=points[i],b=points[(i+1)%points.length];
  if(a[2]>=30)output.push(a);
  if((a[2]>=30)!==(b[2]>=30)){
   const t=(30-a[2])/(b[2]-a[2]);output.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,30]);
  }
 }
 return output;
}
function oval(x,y,rx,ry,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
}
function hero(){
 const x=360,y=325,fur=luna?'#edeafa':'#ffae53',suit=luna?'#564093':'#253966',cape=luna?'#9d6adc':'#b83243',trim=luna?'#c1dcf6':'#ffd16c';
 oval(x,y,27,7,'#14201a88');
 oval(x-12,y-9,9,13,suit);oval(x+12,y-9,9,13,suit);
 oval(x,y-32,21,26,suit);
 poly([[x-17,y-49],[x+17,y-49],[x+23,y-9],[x-25,y-11]],cape);
 oval(x,y-51,19,7,trim);
 poly([[x-19,y-65],[x-21,y-92],[x-3,y-72]],fur);
 poly([[x+19,y-65],[x+21,y-92],[x+3,y-72]],fur);
 oval(x,y-66,21,16,fur);
}
function draw(){
 const sky=ctx.createLinearGradient(0,0,0,410);sky.addColorStop(0,'#5d9bb7');sky.addColorStop(1,'#d7daab');
 ctx.fillStyle=sky;ctx.fillRect(0,0,720,410);
 const sn=Math.sin(p.angle),cs=Math.cos(p.angle);
 const projected=vertices.map(([x,y,z])=>[(x-p.x)*cs-(z-p.z)*sn,y-p.y-160,(x-p.x)*sn+(z-p.z)*cs+435]);
 const drawList=[];
 for(const {f,color} of surfaces){
  const a=f.map(i=>projected[i]);
  if(a.every(v=>v[2]<30))continue;
  const polygon=clipNear(a).map(([x,y,z])=>[360+x*410/z,174-y*410/z]);
  if(polygon.every(v=>v[0]<0)||polygon.every(v=>v[0]>720)||polygon.every(v=>v[1]<0)||polygon.every(v=>v[1]>410))continue;
  drawList.push({polygon,color,depth:(a[0][2]+a[1][2]+a[2][2])/3});
 }
 drawList.sort((a,b)=>b.depth-a.depth);
 let painted=false;
 for(const face of drawList){
  if(!painted&&face.depth<435){hero();painted=true}
  poly(face.polygon,face.color);
 }
 if(!painted)hero();
}
function frame(now){update(Math.min(.05,(now-last)/1000));last=now;draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
