name: Verify free 3D game catalog sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-3d-feeds.yml'
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect public 3D HTML5 publisher feeds
        run: node scripts/probe-3d-feed.mjs
