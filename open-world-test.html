<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Super Paw Heroes • Open World Terrain Test</title><style>*{box-sizing:border-box}body{margin:0;background:#091624;color:white;font:15px system-ui;overflow:hidden}canvas{display:block}#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}#hud>div{background:#10253bc9;border:1px solid #e5ba65;border-radius:10px;padding:8px;max-width:60%}#controls{position:fixed;bottom:16px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end}#pad{display:grid;grid-template-columns:repeat(3,54px);gap:4px}button{min-height:50px;border-radius:13px;border:2px solid #e2ba6c;background:#142d48e8;color:white;font-weight:700;font-size:18px;touch-action:none}#act{width:110px;height:65px;background:#65418b}#info{position:fixed;top:90px;left:10px;max-width:330px;background:#112d42e0;padding:10px;border-radius:9px}#status{color:#ffe7a0}small{font-size:12px;color:#d5e7ff}</style><div id="hud"><div><b>🐾 Super Paw Heroes</b><br><small>OPEN WORLD • playable terrain prototype</small></div><div id="zone">Loading…</div></div><div id="info"><div id="status">Explore roads, find the cave, and solve the crystal puzzle.</div><small>Move with the arrows or WASD. Tap ACTION near crystals or the cave.</small></div><div id="controls"><div id="pad"><span></span><button data-key="up">▲</button><span></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><button id="act">ACTION</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ac6ef);scene.fog=new THREE.Fog(0x9ac6ef,65,145);
const camera=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,.1,250),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe9f6ff,0x536747,2));const sun=new THREE.DirectionalLight(0xffe9bf,2.1);sun.position.set(-25,48,24);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.86});const green=mat(0x539453),snow=mat(0xc9e4e9),rock=mat(0x736b79),wood=mat(0x80522d),road=mat(0xb5a084),leaf=mat(0x287c45),red=mat(0xd92d38),gold=mat(0xe5ad34),crystal=mat(0x9b52ff);
const geo=(type,...a)=>type==='box'?new THREE.BoxGeometry(...a):type==='cone'?new THREE.ConeGeometry(...a):new THREE.SphereGeometry(...a);
function box(x,y,z,w,h,d,m){const o=new THREE.Mesh(geo('box',w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
function ball(x,y,z,r,m){const o=new THREE.Mesh(geo('sphere',r,9,7),m);o.position.set(x,y,z);scene.add(o);return o}
const height=(x,z)=>Math.sin(x*.10)*.42+Math.cos(z*.13)*.34+(x>18?Math.sin(x*.2+z*.1)*.6:0);
const verts=[],indices=[],cols=[];const grass=new THREE.Color(0x559855),frost=new THREE.Color(0xcbdde6),stone=new THREE.Color(0x91828b);for(let z=0;z<=80;z++)for(let x=0;x<=80;x++){const px=x-40,pz=z-40;verts.push(px,height(px,pz),pz);const color=px>19?frost:px< -16?grass:stone;cols.push(color.r,color.g,color.b)}for(let z=0;z<80;z++)for(let x=0;x<80;x++){const i=z*81+x;indices.push(i,i+81,i+1,i+1,i+81,i+82)}const terrain=new THREE.BufferGeometry();terrain.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));terrain.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));terrain.setIndex(indices);terrain.computeVertexNormals();scene.add(new THREE.Mesh(terrain,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide})));
const routes=[[[0,0],[-8,-4],[-18,-10],[-30,-16]],[[0,0],[8,-4],[17,-10],[27,-17]],[[0,0],[0,8],[7,17],[16,27]]];
for(const route of routes){const curve=new THREE.CatmullRomCurve3(route.map(([x,z])=>new THREE.Vector3(x,.2,z)));for(let i=0;i<120;i++){const p=curve.getPoint(i/120),q=curve.getPoint((i+1)/120),a=q.clone().sub(p);const o=box(p.x,height(p.x,p.z)+.12,p.z,2.8,.13,a.length()+.4,road);o.rotation.y=Math.atan2(a.x,a.z)}}
let seed=17;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
for(let i=0;i<230;i++){const x=rnd()*76-38,z=rnd()*76-38;if(Math.hypot(x,z)<7||routes.some(r=>r.some(p=>Math.hypot(x-p[0],z-p[1])<4)))continue;const y=height(x,z);if(x>18){const h=1+rnd()*3;const o=new THREE.Mesh(geo('cone',1+rnd(),h,5),snow);o.position.set(x,y+h/2,z);scene.add(o)}else if(x< -16){box(x,y+.75,z,.28,1.5,.28,wood);const t=new THREE.Mesh(geo('cone',.8+rnd()*.6,2+rnd()*1.3,6),leaf);t.position.set(x,y+2,z);scene.add(t)}else{ball(x,y+.4,z,.4+rnd()*.7,rock)}}
function sign(x,z,label,angle){box(x,height(x,z)+1.2,z,.17,2.4,.17,wood);const board=box(x,height(x,z)+2,z,3.6,.65,.16,wood);board.rotation.y=angle;const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#e9c889';ctx.font='bold 34px sans-serif';ctx.textAlign='center';ctx.fillText(label,256,76);const t=new THREE.CanvasTexture(c),plane=new THREE.Mesh(new THREE.PlaneGeometry(3.5,.8),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide}));plane.position.set(x,height(x,z)+2,z+.1);plane.rotation.y=angle;scene.add(plane)}
sign(-3,-2,'← Forest Lv 10–40',0);sign(3,-2,'Peaks Lv 120–160 →',0);sign(0,4,'↑ Crystal Ruins Lv 30–90',0);
const hero=new THREE.Group();scene.add(hero);const body=new THREE.Mesh(geo('sphere',.55,12,9),mat(0xf38d25));body.scale.y=1.3;body.position.y=1.1;hero.add(body);const head=new THREE.Mesh(geo('sphere',.48,12,9),mat(0xf38d25));head.position.y=2;hero.add(head);for(const dx of [-.32,.32]){const ear=new THREE.Mesh(geo('cone',.22,.53,4),mat(0xf38d25));ear.position.set(dx,2.45,0);hero.add(ear)}const cape=new THREE.Mesh(new THREE.PlaneGeometry(.9,1.2),red);cape.position.set(0,1.35,.48);cape.rotation.x=.3;hero.add(cape);
const cave=box(7,height(7,17)+1,17,3,2,1,rock);const entrance=box(7,height(7,17)+.85,17.6,1.8,1.7,.08,mat(0x1a1330));
const stones=[[-22,-12],[-26,-15],[-30,-18]].map(([x,z],i)=>{const mesh=new THREE.Mesh(geo('cone',.6,1.5,6),crystal);mesh.position.set(x,height(x,z)+.75,z);scene.add(mesh);return {x,z,mesh,done:false,i}});
let opened=false;const status=document.querySelector('#status'),zone=document.querySelector('#zone'),pressed=new Set();const pos={x:0,z:0};function interact(){let nearest=stones.find(p=>!p.done&&Math.hypot(pos.x-p.x,pos.z-p.z)<2.7);if(nearest){nearest.done=true;nearest.mesh.material=gold;nearest.mesh.scale.setScalar(1.18);status.textContent='Crystal '+(nearest.i+1)+' activated! '+stones.filter(s=>s.done).length+'/3';return}if(Math.hypot(pos.x-7,pos.z-17)<3){if(stones.every(s=>s.done)){opened=true;entrance.material=mat(0x28cdb6);status.textContent='Dungeon unlocked! The ancient crystal vault is open. Prototype objective complete.'}else status.textContent='The cave is sealed. Activate the 3 forest crystals first.';return}status.textContent='Follow winding roads. Find three crystals in the forest, then unlock the cave.'}
document.querySelector('#act').addEventListener('click',interact);for(const b of document.querySelectorAll('[data-key]')){const key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pressed.add(key)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>pressed.delete(key))}addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='e'||k===' ')interact();pressed.add(({w:'up',a:'left',s:'down',d:'right',arrowup:'up',arrowleft:'left',arrowdown:'down',arrowright:'right'})[k]||k)});addEventListener('keyup',e=>{const k=e.key.toLowerCase();pressed.delete(({w:'up',a:'left',s:'down',d:'right',arrowup:'up',arrowleft:'left',arrowdown:'down',arrowright:'right'})[k]||k)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;let dx=Number(pressed.has('right'))-Number(pressed.has('left')),dz=Number(pressed.has('down'))-Number(pressed.has('up'));if(dx||dz){const n=Math.hypot(dx,dz);dx/=n;dz/=n;pos.x=THREE.MathUtils.clamp(pos.x+dx*8*dt,-38,38);pos.z=THREE.MathUtils.clamp(pos.z+dz*8*dt,-38,38);hero.rotation.y=Math.atan2(dx,dz)}hero.position.set(pos.x,height(pos.x,pos.z),pos.z);const target=new THREE.Vector3(pos.x,0,pos.z);camera.position.lerp(new THREE.Vector3(pos.x+8,height(pos.x,pos.z)+11,pos.z+13),.08);camera.lookAt(target.x,1,target.z);zone.textContent=(pos.x< -16?'Whisperleaf Forest · Lv 10–40':pos.x>18?'Frostwhisker Peaks · Lv 120–160':pos.z>10?'Crystal Ruins · Lv 30–90':'Sunrise Crossroads · Lv 1–20');renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></html>
